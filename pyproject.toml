[project]
name = "modbus-timesfm-viewer"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
  "PyQt6>=6.7",
  "pyqtgraph>=0.13",
  "pymodbus>=3.13",
  "timesfm[torch]>=2.0.1",
  "numpy>=1.26",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "pyinstaller>=6.6",
]

[project.scripts]
modbus-timesfm-viewer = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
